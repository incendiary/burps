name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install flake8
      - name: Lint tests/ (flake8)
        # The extension (BurpXHookSignature/) uses Jython-only imports
        # (burp, java.io) that do not resolve in CPython, so we lint only
        # the test files where standard Python is used.
        run: flake8 tests/ --max-line-length=100

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest
      - name: Run smoke tests
        run: pytest tests/ -v
